name: Checks

on:
  push:
    branches: [main]
  pull_request:
    # No required checks currently; revisit this filter before requiring a job.
    paths:
      - '**'
      - '!**/*.md'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - name: Install Node development dependencies
        run: pnpm --dir node install --frozen-lockfile --ignore-scripts
      - name: Check TypeScript
        run: |
          pnpm --dir node exec tsc -p tsconfig.json
          pnpm --dir node run check
      - name: Packaging tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Blank lines between Rust items
        run: python3 -I scripts/check-item-spacing.py

  macos:
    if: github.event.repository.private == false
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Match build-bridge.sh so Cargo can reuse dependencies across steps.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: node/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: node/pnpm-lock.yaml
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
          env-vars: MACOSX_DEPLOYMENT_TARGET
      - name: Install Node development dependencies
        run: pnpm --dir node install --frozen-lockfile --ignore-scripts
      # Lints are configured in .cargo/config.toml.
      - name: Format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Rust tests
        run: cargo test --workspace --locked
      - name: Build Node addon and declarations
        run: pnpm --dir node run build
      - name: Node integration tests
        run: pnpm --dir node test

  python:
    if: github.event.repository.private == false
    name: Python wheel (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
          env-vars: MACOSX_DEPLOYMENT_TARGET
      - name: Create isolated Python environments
        run: |
          python3 -m venv "$RUNNER_TEMP/keylet-build"
          python3 -m venv "$RUNNER_TEMP/keylet-test"
          "$RUNNER_TEMP/keylet-build/bin/python" -m pip install 'maturin>=1.9.4,<2'
      - name: Build and smoke-test the release wheel
        env:
          WHEEL_ARCH: ${{ matrix.arch }}
        run: |
          build="$RUNNER_TEMP/keylet-build/bin"
          test_python="$RUNNER_TEMP/keylet-test/bin/python"
          "$build/maturin" build --release --interpreter "$build/python" --out "$RUNNER_TEMP/keylet-wheels"
          cd "$RUNNER_TEMP"
          "$test_python" -m pip install --no-deps --no-index keylet-wheels/*-cp310-abi3-macosx_14_0_"${WHEEL_ARCH}".whl
          "$test_python" -I "$GITHUB_WORKSPACE/python/tests/test_installed.py"
      - name: Test both curves and errors with a public helper
        run: |
          build="$RUNNER_TEMP/keylet-build/bin"
          test_python="$RUNNER_TEMP/keylet-test/bin/python"
          "$build/maturin" build --profile dev --interpreter "$build/python" --out "$RUNNER_TEMP/keylet-fixtures"
          cd "$RUNNER_TEMP"
          "$test_python" -m pip install --force-reinstall --no-deps --no-index keylet-fixtures/*.whl
          "$test_python" "$GITHUB_WORKSPACE/python/tests/test_fixture.py"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keylet-macos-python-${{ matrix.arch }}
          path: ${{ runner.temp }}/keylet-wheels/*.whl
          if-no-files-found: error
