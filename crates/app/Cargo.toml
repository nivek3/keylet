[package]
name = "wallet-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description = "Keylet is a app for managing keys and wallets in Rust."
keywords = ["keylet", "wallet", "crypto", "node", "app"]
categories = ["asynchronous"]

[[bin]]
name = "keylet"
path = "src/main.rs"

[dependencies]
wallet-crypto = { workspace = true }

block2.workspace = true
bs58.workspace = true
core-foundation.workspace = true
eframe.workspace = true
libc.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-local-authentication.workspace = true
security-framework-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize = { workspace = true, features = ["derive"] }
