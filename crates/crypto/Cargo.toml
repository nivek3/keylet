[package]
name = "wallet-crypto"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
bip39 = { version = "=3.0.0", features = ["zeroize"] }
bip32 = { version = "=0.6.0", default-features = false, features = [
	"alloc",
	"secp256k1",
] }
derivation-path = "=0.2.0"
serde = { version = "1", features = ["derive"] }
solana-ed25519 = { version = "=0.2.4", default-features = false, features = [
	"digest",
	"precomputed-tables",
	"zeroize",
] }
sha3 = "=0.12.0"
zeroize = "=1.9.1"
