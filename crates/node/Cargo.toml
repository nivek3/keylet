[package]
name = "wallet-bridge"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core-foundation = "=0.10.1"
napi = { version = "=3.15.0", default-features = false, features = [
	"napi8",
	"serde-json",
	"tokio_rt",
] }
napi-derive = "=3.6.13"
serde_json = "=1.0.154"
libc = "=0.2.191"
k256 = { version = "=0.13.4", default-features = false, features = [
	"std",
	"ecdsa",
] }
tokio = { version = "1", features = ["rt"] }
solana-ed25519 = { version = "=0.2.4", default-features = false, features = [
	"digest",
	"precomputed-tables",
	"zeroize",
] }
zeroize = "=1.9.1"

[build-dependencies]
napi-build = "=2.6.0"
